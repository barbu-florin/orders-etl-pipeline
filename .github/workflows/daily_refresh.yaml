name: Daily pipeline refresh

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install .

      - name: Run pipeline
        env:
          ORDERS_URL: ${{ vars.ORDERS_URL }}
          FX_URL: ${{ vars.FX_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          TARGET_DB_URL: ${{ secrets.TARGET_DB_URL }}
        run: python -m orders_etl_pipeline.main